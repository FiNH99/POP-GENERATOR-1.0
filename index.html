<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Promo Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Promo Generator</h1>
  <p>Generate PDF promo 1, 2, atau 3 produk.</p>

  <form id="promoForm">
    <label>Layout Promo</label>
    <select id="layout" required>
      <option value="1">1 Produk</option>
      <option value="2">2 Produk</option>
      <option value="3">3 Produk</option>
    </select>

    <label>Periode Promo</label>
    <input type="text" id="periode" placeholder="Contoh: 25 Nov - 14 Des 2025" required>

    <div id="productsContainer"></div>

    <button type="submit">Generate PDF</button>
  </form>

  <div id="result"></div>
</div>

<script src="script.js?v=11"></script>
</body>
</html>
