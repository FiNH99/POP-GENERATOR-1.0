<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>POP Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.product-card{
  margin-top:24px;
  padding:18px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.product-card h3{
  margin-top:0;
}

.preview-img{
  max-width:160px;
  margin-top:10px;
  border-radius:8px;
  display:none;
}

#result{
  margin-top:20px;
  padding:14px;
  border-radius:8px;
  display:none;
}

.success{
  display:block !important;
  background:#e7f8ec;
  color:#166534;
}

.error{
  display:block !important;
  background:#fdecec;
  color:#991b1b;
}

@media(max-width:700px){

  .grid-2{
    grid-template-columns:1fr;
  }

  .container{
    margin:16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>POP Generator</h1>
  <p>Generate POP otomatis dari template asli.</p>

  <form id="promoForm">

    <div class="grid-2">

      <div>
        <label>Jenis Template</label>

        <select id="templateType" required>
          <option value="promotion">Promotion</option>
          <option value="exclusive">Exclusive</option>
          <option value="member">Members Only</option>
          <option value="recommends">Recommends</option>
          <option value="bestseller">Best Seller</option>
          <option value="b1g1">Buy 1 Get 1</option>
          <option value="b2g1">Buy 2 Get 1</option>
        </select>
      </div>

      <div>
        <label>Layout</label>

        <select id="layout" required>
          <option value="1">1 Produk</option>
          <option value="2">2 Produk</option>
          <option value="3">3 Produk</option>
        </select>
      </div>

    </div>

    <label>Periode Promo</label>

    <input
      type="text"
      id="periode"
      placeholder="Contoh: 25 Nov - 14 Des 2025"
      required
    >

    <div class="grid-2">

      <div>
        <label>Tanggal Mulai</label>
        <input type="date" id="startDate">
      </div>

      <div>
        <label>Tanggal Selesai</label>
        <input type="date" id="endDate">
      </div>

    </div>

    <button type="button" id="makePeriodBtn">
      Buat Periode dari Kalender
    </button>

    <div id="productsContainer"></div>

    <button type="submit" id="submitBtn">
      Generate PDF
    </button>

  </form>

  <div id="result"></div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyUe-U9rldjDdU1QZLxgEN5yWF4TwPy8Pv1njDXzYbAj4JC2AtCEJ6brV_XYsTEyAoqvA/exec";

const form = document.getElementById("promoForm");
const layoutSelect = document.getElementById("layout");
const productsContainer = document.getElementById("productsContainer");
const resultBox = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

let existingImages = [];

const MONTHS_ID = [
  "Jan","Feb","Mar","Apr","Mei","Jun",
  "Jul","Agu","Sep","Okt","Nov","Des"
];

function formatDateId(dateString){

  const d = new Date(dateString);

  return `${d.getDate()} ${MONTHS_ID[d.getMonth()]} ${d.getFullYear()}`;
}

document
.getElementById("makePeriodBtn")
.addEventListener("click", function(){

  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;

  if(!start || !end){
    alert("Isi tanggal mulai dan selesai.");
    return;
  }

  document.getElementById("periode").value =
    `${formatDateId(start)} - ${formatDateId(end)}`;
});

async function loadExistingImages(){

  try{

    const response =
      await fetch(`${APPS_SCRIPT_URL}?action=listImages`);

    const result = await response.json();

    if(result.status === "success"){
      existingImages = result.images || [];
    }

  }catch(err){

    console.log(err.message);
  }
}

function renderProductForms(){

  const total = Number(layoutSelect.value);

  productsContainer.innerHTML = "";

  for(let i=1; i<=total; i++){

    const imageOptions = existingImages.map(img => {

      return `
        <option
          value="${img.id}"
          data-url="${img.url}"
          data-name="${img.name}"
        >
          ${img.name}
        </option>
      `;
    }).join("");

    productsContainer.innerHTML += `

      <div class="product-card">

        <h3>Produk ${i}</h3>

        <label>Brand</label>
        <input
          type="text"
          id="brand${i}"
          required
        >

        <label>Deskripsi</label>
        <input
          type="text"
          id="deskripsi${i}"
          required
        >

        <div class="grid-2">

          <div>
            <label>Harga Normal</label>

            <input
              type="text"
              id="hargaNormal${i}"
              required
            >
          </div>

          <div>
            <label>Harga Promo</label>

            <input
              type="text"
              id="hargaPromo${i}"
              required
            >
          </div>

        </div>

        <div class="grid-2">

          <div>
            <label>Unit</label>

            <select id="unit${i}">
              <option value="pc">/pc</option>
              <option value="pcs">/pcs</option>
              <option value="100gr">/100gr</option>
              <option value="kg">/kg</option>
              <option value="pack">/pack</option>
            </select>
          </div>

          <div>
            <label>Negara / Flag</label>

            <select id="country${i}">
              <option value="none">Tanpa Flag</option>
              <option value="indonesia">Indonesia</option>
              <option value="china">China</option>
              <option value="australia">Australia</option>
              <option value="new_zealand">New Zealand</option>
              <option value="japan">Japan</option>
              <option value="korea">Korea</option>
              <option value="usa">USA</option>
            </select>
          </div>

        </div>

        <label>Sumber Gambar</label>

        <select
          id="imageMode${i}"
          onchange="toggleImageMode(${i})"
        >
          <option value="upload">
            Upload Gambar Baru
          </option>

          <option value="drive">
            Pilih dari Drive
          </option>
        </select>

        <div id="uploadBox${i}">

          <label>Upload Image Product</label>

          <input
            type="file"
            id="imageFile${i}"
            accept="image/*"
            onchange="previewImage(${i})"
          >

          <img
            id="preview${i}"
            class="preview-img"
          >
        </div>

        <div
          id="driveBox${i}"
          style="display:none;"
        >

          <label>Pilih Gambar Lama</label>

          <select id="existingImage${i}">
            <option value="">
              -- pilih gambar --
            </option>

            ${imageOptions}
          </select>

        </div>

      </div>
    `;
  }
}

function toggleImageMode(i){

  const mode =
    document.getElementById(`imageMode${i}`).value;

  document.getElementById(`uploadBox${i}`).style.display =
    mode === "upload" ? "block" : "none";

  document.getElementById(`driveBox${i}`).style.display =
    mode === "drive" ? "block" : "none";
}

function previewImage(i){

  const file =
    document.getElementById(`imageFile${i}`).files[0];

  const preview =
    document.getElementById(`preview${i}`);

  if(!file){

    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    const reader = new FileReader();

    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  submitBtn.disabled = true;
  submitBtn.textContent = "Generate PDF...";

  resultBox.className = "";
  resultBox.style.display = "block";
  resultBox.textContent = "Sedang generate PDF...";

  try{

    const layout = Number(layoutSelect.value);

    const products = [];

    for(let i=1; i<=layout; i++){

      const imageMode =
        document.getElementById(`imageMode${i}`).value;

      let imageBase64 = "";
      let imageMimeType = "";
      let existingImageId = "";

      if(imageMode === "upload"){

        const file =
          document.getElementById(`imageFile${i}`).files[0];

        if(!file){
          throw new Error(`Produk ${i}: gambar belum dipilih.`);
        }

        imageBase64 = await fileToBase64(file);
        imageMimeType = file.type;

      }else{

        existingImageId =
          document.getElementById(`existingImage${i}`).value;

        if(!existingImageId){
          throw new Error(`Produk ${i}: pilih gambar Drive.`);
        }
      }

      products.push({

        brand:
          document.getElementById(`brand${i}`).value,

        deskripsi:
          document.getElementById(`deskripsi${i}`).value,

        hargaNormal:
          document.getElementById(`hargaNormal${i}`).value,

        hargaPromo:
          document.getElementById(`hargaPromo${i}`).value,

        unit:
          document.getElementById(`unit${i}`).value,

        country:
          document.getElementById(`country${i}`).value,

        imageMode,
        imageBase64,
        imageMimeType,
        existingImageId
      });
    }

    const payload = {

      action:"generatePdf",

      templateType:
        document.getElementById("templateType").value,

      layout:String(layout),

      periode:
        document.getElementById("periode").value,

      products
    };

    const response = await fetch(APPS_SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify(payload)
    });

    const responseText = await response.text();

    const result = JSON.parse(responseText);

    if(result.status === "success"){

      resultBox.className = "success";

      resultBox.innerHTML =
        "<strong>PDF berhasil dibuat!</strong><br><br>" +
        "Request ID: " + result.requestId + "<br>" +
        "File: " + result.fileName + "<br><br>" +
        `<a href="${result.pdfUrl}" target="_blank">
          Buka PDF
        </a>`;

    }else{

      resultBox.className = "error";

      resultBox.textContent =
        "Error: " + result.message;
    }

  }catch(error){

    resultBox.className = "error";

    resultBox.textContent =
      "Gagal: " + error.message;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Generate PDF";
});

layoutSelect.addEventListener("change", renderProductForms);

async function init(){

  await loadExistingImages();

  renderProductForms();
}

init();

</script>

</body>
</html>
